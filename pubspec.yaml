name: breadcrumb
description: A warehouse management system with AI integration.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.3
  firebase_auth_web: ^5.14.2
  cloud_firestore: ^5.6.7
  cloud_firestore_web: ^4.4.7
  firebase_analytics: ^11.4.5
  firebase_analytics_web: ^0.5.10+11
  http: ^1.1.0
  flutter_secure_storage: ^9.0.0
  cloud_functions: ^5.5.0
  qr_code_scanner: ^1.0.1
  mobile_scanner: ^3.5.0
  flutter_barcode_scanner: ^2.0.0
  fl_chart: ^0.64.0
  url_launcher: ^6.2.6
  file_picker: ^10.1.9
  firebase_storage: ^12.4.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/Breadcrumb.png 